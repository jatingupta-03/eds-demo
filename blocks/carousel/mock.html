<div class="carousel">
    <div class="slides" id="slides">
        <div class="slide">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80"
                 alt="Beautiful mountain landscape">
            <div class="caption">
                <h2>Explore the World</h2>
                <p>Discover breathtaking landscapes and create unforgettable memories.</p>
            </div>
        </div>

        <div class="slide">
            <img
                    src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=80"
                    alt="Ocean waves">
            <div class="caption">
                <h2>Find Your Escape</h2>
                <p>Let the ocean breeze and peaceful waves
                    take you somewhere beautiful.</p>
            </div>
        </div>

        <div class="slide">
            <img
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=80"
                    alt="Mountain lake">
            <div class="caption">
                <h2>Embrace Nature</h2>
                <p>Experience the beauty of nature, one
                    adventure at a time.</p>
            </div>
        </div>

    </div>

    <button class="arrow prev" aria-label="Previous slide"
    onclick="moveSlide(-1)">&#10094;</button>
    <button class="arrow next" aria-label="Next slide"
    onclick="moveSlide(1)">&#10095;</button>

    <div class="dots" id="dots"></div>
</div>
